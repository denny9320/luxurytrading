<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 大理石纹理渐变 -->
    <linearGradient id="marbleBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8"/>
      <stop offset="25%" style="stop-color:#ede5d5"/>
      <stop offset="50%" style="stop-color:#f8f3eb"/>
      <stop offset="75%" style="stop-color:#e8dfd0"/>
      <stop offset="100%" style="stop-color:#f0e8d8"/>
    </linearGradient>

    <!-- 大理石纹路 -->
    <linearGradient id="vein1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a962;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#c9a962;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#c9a962;stop-opacity:0.12"/>
    </linearGradient>

    <linearGradient id="vein2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7355;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#8b7355;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#8b7355;stop-opacity:0.08"/>
    </linearGradient>

    <filter id="marbleBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="softBlur2">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- 基础大理石色 -->
  <rect width="800" height="600" fill="url(#marbleBase)"/>

  <!-- 大理石纹路 -->
  <path d="M0,100 Q200,80 400,150 T800,120" fill="none" stroke="url(#vein1)" stroke-width="2" filter="url(#marbleBlur)"/>
  <path d="M0,250 Q150,280 350,220 T800,260" fill="none" stroke="url(#vein2)" stroke-width="1.5" filter="url(#marbleBlur)"/>
  <path d="M0,400 Q250,380 500,420 T800,390" fill="none" stroke="url(#vein1)" stroke-width="1" filter="url(#marbleBlur)"/>
  <path d="M0,520 Q200,500 400,540 T800,510" fill="none" stroke="url(#vein2)" stroke-width="1.5" filter="url(#marbleBlur)"/>

  <!-- 柔和光斑 -->
  <ellipse cx="300" cy="200" rx="200" ry="150" fill="#c9a962" opacity="0.05" filter="url(#softBlur2)"/>
  <ellipse cx="600" cy="400" rx="150" ry="100" fill="#c9a962" opacity="0.04" filter="url(#softBlur2)"/>

  <!-- 细微纹理 -->
  <circle cx="100" cy="100" r="1" fill="#8b7355" opacity="0.1"/>
  <circle cx="250" cy="300" r="0.8" fill="#8b7355" opacity="0.08"/>
  <circle cx="500" cy="150" r="1.2" fill="#8b7355" opacity="0.06"/>
  <circle cx="700" cy="350" r="0.6" fill="#8b7355" opacity="0.1"/>
  <circle cx="400" cy="500" r="1" fill="#8b7355" opacity="0.08"/>
</svg>
