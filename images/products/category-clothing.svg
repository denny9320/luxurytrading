<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="50%" style="stop-color:#2a2520"/>
      <stop offset="100%" style="stop-color:#1a1510"/>
    </linearGradient>

    <radialGradient id="clothGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#c9a962;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#c9a962;stop-opacity:0"/>
    </radialGradient>

    <filter id="clothBlur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#clothGrad)"/>
  <rect width="600" height="800" fill="url(#clothGlow)"/>

  <ellipse cx="300" cy="300" rx="200" ry="250" fill="#c9a962" opacity="0.05" filter="url(#clothBlur)"/>

  <line x1="0" y1="400" x2="600" y2="400" stroke="#c9a962" stroke-width="0.3" opacity="0.08"/>
  <line x1="300" y1="0" x2="300" y2="800" stroke="#c9a962" stroke-width="0.3" opacity="0.05"/>

  <rect x="250" y="350" width="100" height="100" fill="none" stroke="#c9a962" stroke-width="0.5" opacity="0.08"/>
</svg>
