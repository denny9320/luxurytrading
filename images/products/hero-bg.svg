<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 主渐变 - 深邃黑金 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="30%" style="stop-color:#1a1a1a"/>
      <stop offset="60%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1510"/>
    </linearGradient>

    <!-- 金色光晕 -->
    <radialGradient id="goldGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#c9a962;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#c9a962;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="goldGlow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#c9a962;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#c9a962;stop-opacity:0"/>
    </radialGradient>

    <!-- 微妙纹理 -->
    <pattern id="noise" width="400" height="400" patternUnits="userSpaceOnUse">
      <rect width="400" height="400" fill="none"/>
      <circle cx="50" cy="50" r="0.5" fill="#c9a962" opacity="0.03"/>
      <circle cx="150" cy="100" r="0.3" fill="#c9a962" opacity="0.02"/>
      <circle cx="250" cy="200" r="0.4" fill="#c9a962" opacity="0.03"/>
      <circle cx="350" cy="300" r="0.5" fill="#c9a962" opacity="0.02"/>
      <circle cx="100" cy="250" r="0.3" fill="#c9a962" opacity="0.03"/>
      <circle cx="300" cy="150" r="0.4" fill="#c9a962" opacity="0.02"/>
      <circle cx="200" cy="350" r="0.5" fill="#c9a962" opacity="0.03"/>
      <circle cx="50" cy="350" r="0.3" fill="#c9a962" opacity="0.02"/>
      <circle cx="350" cy="50" r="0.4" fill="#c9a962" opacity="0.03"/>
    </pattern>

    <!-- 几何线条装饰 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a962;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#c9a962;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#c9a962;stop-opacity:0"/>
    </linearGradient>

    <!-- 柔和光斑 -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- 基础背景 -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- 金色光晕 -->
  <rect width="1920" height="1080" fill="url(#goldGlow1)"/>
  <rect width="1920" height="1080" fill="url(#goldGlow2)"/>

  <!-- 柔和光斑 -->
  <ellipse cx="960" cy="400" rx="500" ry="300" fill="#c9a962" opacity="0.04" filter="url(#softBlur)"/>
  <ellipse cx="400" cy="800" rx="400" ry="200" fill="#c9a962" opacity="0.03" filter="url(#softBlur)"/>

  <!-- 几何装饰线 -->
  <line x1="0" y1="200" x2="1920" y2="200" stroke="url(#lineGrad)" stroke-width="0.5"/>
  <line x1="0" y1="880" x2="1920" y2="880" stroke="url(#lineGrad)" stroke-width="0.5"/>

  <!-- 对角线装饰 -->
  <line x1="0" y1="0" x2="600" y2="1080" stroke="#c9a962" stroke-width="0.3" opacity="0.05"/>
  <line x1="1920" y1="0" x2="1320" y2="1080" stroke="#c9a962" stroke-width="0.3" opacity="0.05"/>

  <!-- 微妙纹理 -->
  <rect width="1920" height="1080" fill="url(#noise)"/>

  <!-- 中心装饰框 -->
  <rect x="760" y="340" width="400" height="400" fill="none" stroke="#c9a962" stroke-width="0.5" opacity="0.08"/>
  <rect x="780" y="360" width="360" height="360" fill="none" stroke="#c9a962" stroke-width="0.3" opacity="0.05"/>
</svg>
