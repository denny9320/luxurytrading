name: 网站自动化优化（每次推送自动执行）
on:
  push:
    branches: [ main, master ]

# 👇 这里强制启用 Node.js 24，彻底消除警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
    - name: 克隆代码
      uses: actions/checkout@v4.2.1  # 👈 已修复 Node.js 24 兼容
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 安装优化工具
      run: |
        npm install -g sharp
        sudo apt-get update && sudo apt-get install -y jpegoptim optipng

    - name: 生成SEO文件（robots.txt + sitemap.xml）
      run: |
        cat > robots.txt << EOF
        User-agent: *
        Allow: /
        Disallow: /admin
        Sitemap: https://www.luxurytrading.cn/sitemap.xml
        EOF
        
        cat > sitemap.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          <url><loc>https://www.luxurytrading.cn/</loc><lastmod>$(date -I)</lastmod><priority>1.0</priority></url>
          <url><loc>https://www.luxurytrading.cn/products</loc><lastmod>$(date -I)</lastmod><priority>0.8</priority></url>
          <url><loc>https://www.luxurytrading.cn/about</loc><lastmod>$(date -I)</lastmod><priority>0.6</priority></url>
        </urlset>
        EOF

    - name: 自动压缩所有图片
      run: |
        find . -name "*.jpg" -o -name "*.jpeg" | xargs jpegoptim --max=80 --strip-all || true
        find . -name "*.png" | xargs optipng -o2 || true

    - name: 设置缓存策略（提升加载速度）
      run: |
        cat > _headers << EOF
        /*.css
          Cache-Control: max-age=31536000
        /*.js
          Cache-Control: max-age=31536000
        /*.jpg
          Cache-Control: max-age=31536000
        /*.png
          Cache-Control: max-age=31536000
        EOF

    - name: 提交优化结果
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --staged --quiet || git commit -m "🤖 自动优化：SEO+图片+缓存"
        git push
