<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURYTRADING | 全球奢品集结</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Quick Luxury Theme Override */
        :root {
            --primary: #0a0a0a;
            --accent: #c9a962;
            --bg: #0d0d0d;
            --text: #f5f5f5;
            --text-muted: #888;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0d0d0d;
            color: #f5f5f5;
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 50%, #0d0d0d 100%);
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(201,169,98,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(201,169,98,0.08) 0%, transparent 50%);
        }
        
        .hero-content {
            text-align: center;
            z-index: 2;
            padding: 20px;
        }
        
        .hero-logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(48px, 10vw, 120px);
            font-weight: 400;
            letter-spacing: 20px;
            color: #fff;
            margin-bottom: 10px;
        }
        
        .hero-tagline {
            font-size: 14px;
            letter-spacing: 8px;
            color: #c9a962;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        
        .hero-title {
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 300;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .hero-desc {
            font-size: 16px;
            color: #888;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        
        .hero-stat {
            text-align: center;
        }
        
        .hero-stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 40px;
            color: #c9a962;
        }
        
        .hero-stat-label {
            font-size: 12px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .hero-btns {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 16px 40px;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-gold {
            background: #c9a962;
            color: #0d0d0d;
        }
        
        .btn-gold:hover {
            background: #dfc078;
        }
        
        .btn-outline {
            border: 1px solid #c9a962;
            color: #c9a962;
            background: transparent;
        }
        
        .btn-outline:hover {
            background: #c9a962;
            color: #0d0d0d;
        }
        
        /* Products Section */
        .products-section {
            padding: 80px 20px;
            background: #0d0d0d;
        }
        
        .products-header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .products-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .products-subtitle {
            color: #666;
            font-size: 14px;
        }
        
        /* Category Tabs */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .category-tab {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid #333;
            color: #888;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .category-tab:hover {
            border-color: #c9a962;
            color: #c9a962;
        }
        
        .category-tab.active {
            background: #c9a962;
            border-color: #c9a962;
            color: #0d0d0d;
        }
        
        .category-tab .count {
            font-size: 11px;
            opacity: 0.7;
            margin-left: 6px;
        }
        
        /* Search Bar */
        .search-bar {
            max-width: 600px;
            margin: 0 auto 40px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 16px 24px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            border-color: #c9a962;
        }
        
        .search-input::placeholder {
            color: #555;
        }
        
        /* Products Grid */
        .products-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)) !important;
            gap: 24px !important;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 300px;
            background: #111 !important;
            color: #fff !important;
        }
        
        .product-card {
            background: #333 !important;
            border: 1px solid #c9a962 !important;
            padding: 20px;
            color: #fff !important;
        }
        
        .product-card {
            background: #151515;
            border: 1px solid #222;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .product-card:hover {
            border-color: #c9a962;
            transform: translateY(-4px);
        }
        
        .product-img-wrap {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .product-img-wrap:empty::after {
            content: '暂无图片';
            color: #555;
        }
        
        .product-card:hover .product-img {
            transform: scale(1.05);
        }
        
        .product-info {
            padding: 20px;
        }
        
        .product-cat {
            font-size: 11px;
            color: #c9a962;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .product-name {
            font-size: 14px;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .product-price {
            font-size: 16px;
            color: #c9a962;
            font-weight: 500;
        }
        
        .product-price::before {
            content: '¥';
            font-size: 12px;
            margin-right: 2px;
        }
        
        .no-img {
            color: #444;
            font-size: 12px;
            text-align: center;
        }
        
        /* Load More */
        .load-more {
            text-align: center;
            margin-top: 50px;
        }
        
        .load-more-btn {
            padding: 16px 50px;
            background: transparent;
            border: 1px solid #333;
            color: #888;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        
        .load-more-btn:hover {
            border-color: #c9a962;
            color: #c9a962;
        }
        
        /* Footer */
        .footer {
            background: #0a0a0a;
            padding: 60px 20px;
            text-align: center;
            border-top: 1px solid #222;
        }
        
        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            letter-spacing: 8px;
            color: #fff;
            margin-bottom: 20px;
        }
        
        .footer-text {
            color: #555;
            font-size: 13px;
        }
        
        .footer-copy {
            margin-top: 30px;
            color: #333;
            font-size: 12px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero-stats {
                gap: 30px;
            }
            
            .category-tabs {
                gap: 8px;
            }
            
            .category-tab {
                padding: 10px 16px;
                font-size: 12px;
            }
            
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Hero -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-logo">LUXURY</h1>
            <p class="hero-tagline">TRADING</p>
            <h2 class="hero-title">Discover Premium</h2>
            <p class="hero-desc">汇聚全球顶级奢侈品，香水、服装、包包、首饰一站式选购</p>
            
            <div class="hero-stats">
                <div class="hero-stat">
                    <div class="hero-stat-num">3307+</div>
                    <div class="hero-stat-label">精品款式</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-num">9</div>
                    <div class="hero-stat-label">精选品类</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-num">50K+</div>
                    <div class="hero-stat-label">客户信赖</div>
                </div>
            </div>
            
            <div class="hero-btns">
                <a href="#products" class="btn btn-gold">开始选购</a>
                <a href="order-form.html" class="btn btn-outline">自助下单</a>
            </div>
        </div>
    </section>
    
    <!-- Products -->
    <section class="products-section" id="products">
        <div class="products-header">
            <h2 class="products-title">甄选全球奢品</h2>
            <p class="products-subtitle">所有产品均来自正规渠道，品质保证</p>
        </div>
        
        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs">
            <button class="category-tab active" data-category="all">全部 <span class="count">(3307)</span></button>
            <button class="category-tab" data-category="fragrance">香水 <span class="count">(1641)</span></button>
            <button class="category-tab" data-category="bags">包包 <span class="count">(888)</span></button>
            <button class="category-tab" data-category="clothing">服装 <span class="count">(396)</span></button>
            <button class="category-tab" data-category="glasses">眼镜 <span class="count">(161)</span></button>
            <button class="category-tab" data-category="jewelry">首饰 <span class="count">(133)</span></button>
            <button class="category-tab" data-category="shoes">鞋子 <span class="count">(70)</span></button>
            <button class="category-tab" data-category="watches">腕表 <span class="count">(5)</span></button>
            <button class="category-tab" data-category="accessories">配饰 <span class="count">(13)</span></button>
        </div>
        
        <!-- Search -->
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索产品名称...">
        </div>
        
        <!-- Products Grid -->
        <div class="products-grid" id="productsGrid" style="min-height:500px;">
            <p style="grid-column:1/-1;text-align:center;color:#fff;padding:60px 0;">正在加载产品...</p>
        </div>
        
        <!-- Load More -->
        <div class="load-more">
            <button class="load-more-btn" id="loadMoreBtn">加载更多</button>
        </div>
    </section>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="footer-logo">LUXURYTRADING</div>
        <p class="footer-text">汇聚全球奢品 | 品质保证 | 假一赔十</p>
        <p class="footer-copy">&copy; 2026 LuxuryTrading. All Rights Reserved.</p>
</footer>
    
    <script>
        // All Products Data
        var allProducts = [];
        var filteredProducts = [];
        var currentCategory = 'all';
        var displayCount = 24;
        var searchTerm = '';
        
        // Load all products
        async function loadAllProducts() {
            console.log('Starting product load...');
            var response = await fetch('data/products.json');
            var data = await response.json();
            
            allProducts = [];
            for (var cat in data) {
                if (Array.isArray(data[cat])) {
                    for (var i = 0; i < data[cat].length; i++) {
                        var p = data[cat][i];
                        p.categoryKey = cat;
                        allProducts.push(p);
                    }
                }
            }
            
// Debug: check first image
            console.log('First product:', allProducts[0] ? allProducts[0].name : 'none');
            console.log('First image:', allProducts[0] && allProducts[0].images ? allProducts[0].images[0] : 'no images');
            
            filteredProducts = allProducts;
            renderProducts();
            console.log('Loaded ' + allProducts.length + ' products');
        }
        
// Render products
        function renderProducts() {
            console.log('renderProducts called, count:', filteredProducts.length);
            var grid = document.getElementById('productsGrid');
            var toShow = filteredProducts.slice(0, displayCount);
            
            if (toShow.length === 0) {
                grid.innerHTML = '<p style="color:#fff;grid-column:1/-1;text-align:center;padding:60px 0;">未找到相关产品</p>';
                return;
            }
            
            var html = '';
            for (var i = 0; i < toShow.length; i++) {
                var p = toShow[i];
                var img = p.images && p.images[0] ? p.images[0] : '';
                var name = p.name || p.nameEn || 'Unknown Product';
                var price = p.price || 0;
                var hasImg = img && img.length > 0;
                var catDisplay = p.categoryKey;
                
                if (catDisplay) {
                    if (catDisplay === 'fragrance') catDisplay = '香水';
                    else if (catDisplay === 'bags') catDisplay = '包包';
                    else if (catDisplay === 'clothing') catDisplay = '服装';
                    else if (catDisplay === 'glasses') catDisplay = '眼镜';
                    else if (catDisplay === 'jewelry') catDisplay = '首饰';
                    else if (catDisplay === 'shoes') catDisplay = '鞋子';
                    else if (catDisplay === 'watches') catDisplay = '腕表';
                    else if (catDisplay === 'accessories') catDisplay = '配饰';
                }
                
                // 直接用内联样式确保显示
                html += '<div style="background:#222;padding:15px;margin:8px;border:1px solid #c9a962;display:inline-block;width:220px;vertical-align:top;color:#fff;box-sizing:border-box;">';
                if (hasImg) {
                    html += '<img src="' + img + '" style="width:100%;height:150px;object-fit:cover;display:block;background:#333;" onerror="this.style.display=\'none\'">';
                }
                html += '<div style="color:#c9a962;margin:8px 0;font-size:12px;">' + (catDisplay || '') + '</div>';
                html += '<div style="font-size:14px;line-height:1.3;">' + (name || '').substring(0,40) + '</div>';
                html += '<div style="color:#c9a962;font-size:16px;margin-top:8px;font-weight:bold;">¥' + price.toFixed(2) + '</div>';
                html += '</div>';
            }
            
            grid.innerHTML = html;
            console.log('Grid innerHTML length:', html.length);
        }
            
            var html = '';
            for (var i = 0; i < toShow.length; i++) {
                var p = toShow[i];
                var img = p.images && p.images[0] ? p.images[0] : '';
                var name = p.name || p.nameEn || 'Unknown Product';
                var price = p.price || 0;
                var hasImg = img && img.length > 0;
                var catDisplay = p.categoryKey;
                
                if (catDisplay === 'fragrance') catDisplay = '香水';
                else if (catDisplay === 'bags') catDisplay = '包包';
                else if (catDisplay === 'clothing') catDisplay = '服装';
                else if (catDisplay === 'glasses') catDisplay = '眼镜';
                else if (catDisplay === 'jewelry') catDisplay = '首饰';
                else if (catDisplay === 'shoes') catDisplay = '鞋子';
                else if (catDisplay === 'watches') catDisplay = '腕表';
                else if (catDisplay === 'accessories') catDisplay = '配饰';
                
                html += '<div class="product-card" style="background:#333;padding:20px;margin:10px;border:1px solid #c9a962;display:inline-block;width:250px;">';
                html += '<div class="product-img-wrap">';
                if (hasImg) {
                    html += '<img class="product-img" src="' + img + '" alt="' + name + '" style="width:100%;height:200px;object-fit:cover;background:#444;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">';
                    html += '<span class="no-img" style="display:none;">暂无图片</span>';
                } else {
                    html += '<div class="no-img">暂无图片</div>';
                }
                html += '</div>';
                html += '<div class="product-info">';
                html += '<div class="product-cat">' + catDisplay + '</div>';
                html += '<div class="product-name">' + name + '</div>';
                html += '<div class="product-price">' + price.toFixed(2) + '</div>';
                html += '</div>';
                html += '</div>';
            }
            grid.innerHTML = html;
            
            console.log('Grid innerHTML length:', html.length);
            
            // Debug: force all children visible
            var childs = grid.children;
            for (var i = 0; i < childs.length; i++) {
                childs[i].style.display = 'inline-block';
            }
        }
        
 // Filter by category
        function filterByCategory(category) {
            currentCategory = category;
            displayCount = 24;
            
            if (category === 'all') {
                if (searchTerm) {
                    filteredProducts = allProducts.filter(function(p) {
                        return (p.name && p.name.toLowerCase().indexOf(searchTerm.toLowerCase()) > -1) || 
                               (p.nameEn && p.nameEn.toLowerCase().indexOf(searchTerm.toLowerCase()) > -1);
                    });
                } else {
                    filteredProducts = allProducts.slice(0);
                }
            } else {
                filteredProducts = [];
                for (var i = 0; i < allProducts.length; i++) {
                    var p = allProducts[i];
                    if (p.categoryKey === category) {
                        if (!searchTerm || (p.name && p.name.toLowerCase().indexOf(searchTerm.toLowerCase()) > -1) || 
                           (p.nameEn && p.nameEn.toLowerCase().indexOf(searchTerm.toLowerCase()) > -1)) {
                            filteredProducts.push(p);
                        }
                    }
                }
            }
            
            renderProducts();
        }
        
        // Search
        var searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', function(e) {
                searchTerm = e.target.value;
                filterByCategory(currentCategory);
            });
        }
        
        // Category tabs
        var categoryTabs = document.getElementById('categoryTabs');
        if (categoryTabs) {
            categoryTabs.addEventListener('click', function(e) {
                if (e.target.classList && e.target.classList.contains('category-tab')) {
                    var tabs = categoryTabs.querySelectorAll('.category-tab');
                    for (var i = 0; i < tabs.length; i++) {
                        tabs[i].classList.remove('active');
                    }
                    e.target.classList.add('active');
                    filterByCategory(e.target.dataset.category);
                }
            });
        }
        
        // Load more
        var loadMoreBtn = document.getElementById('loadMoreBtn');
        if (loadMoreBtn) {
            loadMoreBtn.addEventListener('click', function() {
                displayCount += 24;
                renderProducts();
            });
        }
        
        // Init
        loadAllProducts();
    </script>
</body>
</html>
